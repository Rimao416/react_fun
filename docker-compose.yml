
services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: siye-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: siye_users
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - siye-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: siye-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - siye-network

  # pgAdmin - Interface pour PostgreSQL
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: siye-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@siye.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - siye-network

  # Redis Commander - Interface pour Redis
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: siye-redis-commander
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - siye-network

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:

networks:
  siye-network:
    driver: bridge